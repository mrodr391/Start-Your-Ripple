<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Charity Water — Canva Embed</title>
  <style>
    /* Beginner-friendly CSS with simple layout */
    body { background:#f2f4f6; font-family: Arial, Helvetica, sans-serif; margin:0; padding:30px; }
    .container { max-width:980px; margin:0 auto; background:#f9d6c9; padding:36px; border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,0.08); position:relative; }
    /* Small pill nav in the upper-left */
    .nav { position:absolute; top:18px; left:18px; display:flex; gap:10px; }
    .nav a { background:#eaf6f6; color:#577; padding:6px 12px; border-radius:16px; text-decoration:none; font-size:13px; }
    /* Brand in upper-right */
    .brand { position:absolute; top:16px; right:18px; font-weight:700; color:#222; }
    .hero { text-align:center; padding-top:18px; }
    .hero h1 { color:#b1573b; font-size:44px; margin:10px 0 6px; }
    .hero p { color:#6aa6b8; font-style:italic; margin:0 0 18px; }
    /* Simple droplet button made with border-radius */
    .droplet { display:inline-block; width:120px; height:120px; background:#8fbfc9; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%; box-shadow:0 10px 18px rgba(0,0,0,0.12); color:#ffd87a; font-weight:700; line-height:120px; text-align:center; text-decoration:none; }
    /* Three-image gallery using inline-block columns */
    .gallery { margin-top:26px; text-align:center; }
    .card { width:30%; display:inline-block; margin:0 1.66%; vertical-align:top; box-shadow:0 6px 12px rgba(0,0,0,0.12); background:#fff; border:6px solid #aec; }
    .card img{ width:100%; height:200px; object-fit:cover; display:block; }
    /* Embed wrapper keeping 16:10 aspect like the Canva embed */
    .embed-wrap { width:100%; padding-top:62.5%; position:relative; margin-top:22px; border-radius:8px; overflow:hidden; }
    .embed-wrap iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:0; }
    .footer-link{ display:block; text-align:center; margin-top:12px; color:#2b2b2b; text-decoration:none; }
    @media (max-width:720px){ .hero h1{font-size:28px;} .card{width:100%; margin:10px 0;} }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav">
      <a href="#">About Water Crisis</a>
      <a href="#">Stories &amp; Impact</a>
      <a href="#">How It Works</a>
    </nav>
    <div class="brand">charity: water</div>

    <header class="hero">
      <h1>Bring Light to Stories Through Water</h1>
      <p>Clean Water Transforms Lives Instantly</p>
      <!-- Droplet call-to-action -->
      <a href="#" class="droplet">Start Your Ripple</a>
    </header>

    <!-- Three photo cards below the hero. Replace the src URLs with real images from the project. -->
    <div class="gallery">
      <div class="card"><img src="https://via.placeholder.com/800x600?text=Photo+1" alt="Photo 1"></div>
      <div class="card"><img src="https://via.placeholder.com/800x600?text=Photo+2" alt="Photo 2"></div>
      <div class="card"><img src="https://via.placeholder.com/800x600?text=Photo+3" alt="Photo 3"></div>
    </div>

    <!-- Canva embed: keeps the original embed and fits it inside the styled page -->
    <div class="embed-wrap">
      <iframe loading="lazy" src="https://www.canva.com/design/DAHTq-m9ZYM/0KOVa4_23vmx86RM6NbmYQ/watch?embed" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>
    </div>

    <a class="footer-link" href="https://www.canva.com/design/DAHTq-m9ZYM/0KOVa4_23vmx86RM6NbmYQ/watch?utm_content=DAHTq-m9ZYM&utm_campaign=designshare&utm_medium=embeds&utm_source=link" target="_blank" rel="noopener">Copy of Charity Water Landing Page Template — Marisa Rodriguez-Tiglio</a>
  </div>

  <!-- Notes for beginners: Change the placeholder images and the iframe src to use your final assets or a different Canva design. -->
</body>
</html>
